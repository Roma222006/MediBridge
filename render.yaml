services:
  # Backend API Modular Monolith
  - type: web
    name: medibridge-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CORS_ORIGIN
        value: "*"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: VAULT_SECRET_KEY
        generateValue: true
      - key: VAULT_STORAGE_DRIVER
        value: local
      - key: VAULT_LOCAL_DIR
        value: ./uploads
      - key: TELECONSULT_SECRET
        generateValue: true

  # Frontend Single Page Application
  - type: static
    name: medibridge-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: medibridge-api
          property: host
