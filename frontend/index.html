<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MediBridge - Healthcare Coordination Platform. Discover, book, consult, refer, and follow through on care." />
    <meta name="theme-color" content="#102D3A" />
    <link rel="manifest" href="/manifest.json" />
    <title>MediBridge | Healthcare Coordination Platform</title>
    <!-- Fonts: Manrope (headings) & Inter (body, tables, forms) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Progressive Web App Service Worker for Emergency Mode
      if ('serviceWorker' in navigator && window.location.protocol === 'https:' || window.location.hostname === 'localhost') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('[PWA] Service worker registration ignored:', err.message);
          });
        });
      }
    </script>
  </body>
</html>
