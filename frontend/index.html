<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MediBridge - Healthcare Coordination Platform. Discover, book, consult, refer, and follow through on care." />
    <meta name="theme-color" content="#702B59" />
    <link rel="manifest" href="/manifest.json" />
    <title>MediBridge | Healthcare Coordination Platform</title>
    <!-- Preload critical self-hosted font weights -->
    <link rel="preload" href="/fonts/manrope-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-400-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Progressive Web App Service Worker for Emergency Mode
      if ('serviceWorker' in navigator && window.location.protocol === 'https:' || window.location.hostname === 'localhost') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('[PWA] Service worker registration ignored:', err.message);
          });
        });
      }
    </script>
  </body>
</html>
